<sc-if value="{{ showStickyBar }}" hint-placeholder-val="{{ false }}">
  <div data-ff="stickyBar" style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 300; background: rgba(253,249,246,0.96); backdrop-filter: blur(14px); border-top: 1px solid #F0E2DB; box-shadow: 0 -8px 24px -12px rgba(69,55,72,0.18); animation: ff-bar-in .32s cubic-bezier(.2,.7,.2,1) both;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px clamp(16px, 4vw, 24px) calc(12px + env(safe-area-inset-bottom));">
      <div style="flex: 1 1 auto; min-width: 0;">
        <div style="font-family: Outfit, sans-serif; font-weight: 700; font-size: 14.5px; letter-spacing: -0.015em; color: #453748;">See today's plan for your phase</div>
        <div style="font-size: 12.5px; color: #5F5062;">Free check-in · 60 seconds · no signup</div>
      </div>
      <a href="#check-in" onClick="{{ openQuiz }}" style="flex: 0 0 auto; font-family: Outfit, sans-serif; font-weight: 700; font-size: 15px; color: #FDF9F6; background: #8D4F83; padding: 14px 22px; border-radius: 16px; box-shadow: 0 10px 20px -10px rgba(141,79,131,0.5);">Start the check-in</a>
    </div>
  </div>
</sc-if>
